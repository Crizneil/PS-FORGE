<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07101b" />
    <meta
      name="description"
      content="Offline-first personal workout tracker with RPG progression."
    />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2307101b'/%3E%3Cpath d='M22 50h56M31 32v36M69 32v36M14 40v20M86 40v20' stroke='%236be7ff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>FORGE SYSTEM</title>
  </head>
  <body>
    <div class="app-bg" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark">F</span>
        <div>
          <p class="eyebrow">PERSONAL SYSTEM</p>
          <strong>FORGE</strong>
        </div>
      </div>
      <button class="icon-btn" id="soundToggle" aria-label="Toggle sound">
        VOL
      </button>
    </header>

    <main id="app" class="app-shell"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active">
        <span>SYS</span><small>Home</small>
      </button>
      <button data-route="workout" class="nav-item">
        <span>RUN</span><small>Workout</small>
      </button>
      <button data-route="history" class="nav-item">
        <span>LOG</span><small>History</small>
      </button>
      <button data-route="stats" class="nav-item">
        <span>XP</span><small>Stats</small>
      </button>
      <button data-route="settings" class="nav-item">
        <span>CFG</span><small>Settings</small>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script src="app.js?v=2"></script>
  </body>
</html>
